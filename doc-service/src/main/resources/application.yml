server:
  port: 8083
spring:
  application:
    name: doc-service
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      discovery:
        username: nacos
        password: nacos
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai-doc
    username: root
    password: 1234
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    # 生产者连接超时时间
    connection-timeout: 1s
    # 连接失败重试
    template:
      retry:
        # 开启重试（如果对性能要求较为敏感建议关闭）
        enabled: false
        # 失败重试的初始等待时间
        initial-interval: 1000ms
        # 失败后的下次等待时长倍数
        multiplier: 1
        # 最大重试次数
        max-retries: 3
    # 设置生产者确认
    publisher-confirm-type: correlated
    publisher-returns: true
    # 控制消费者的消息预取值
    listener:
      simple:
        prefetch: 5






mybatis:
  configuration:
    map-underscore-to-camel-case: true
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl


file:
  upload:
    url: E:\Software\Projects\ai-doc-system\upload

