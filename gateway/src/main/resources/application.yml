server:
  port: 8081
spring:
  application:
    name: gateway
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      discovery:
        username: nacos
        password: nacos

    gateway:
      server:
        webflux:
          routes:
            - id: user
              uri: lb://user-service
              predicates:
                - Path=/user/**